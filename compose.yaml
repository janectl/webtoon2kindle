
services:
  webtoon2kindle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtoon2kindle
    restart: unless-stopped

    ports:
      - "127.0.0.1:8091:8091"

    environment:
      PYTHONUNBUFFERED: "1"
      MAX_UPLOAD_MB: "512"
      MAX_EPISODE_IMAGES: "500"

    mem_limit: 2g

    security_opt:
      - no-new-privileges:true