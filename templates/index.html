<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Webtoon2Kindle</title><style>body{font:16px system-ui;background:#f4f5f7;color:#20232a;margin:0;padding:48px 16px}.card{max-width:550px;margin:auto;background:white;padding:32px;border-radius:16px;box-shadow:0 8px 32px #0001}h1{margin-top:0}label{display:block;margin:18px 0 8px}input,select,button{font:inherit}input[type=file]{max-width:100%}button{background:#222;color:white;border:0;padding:14px 20px;border-radius:9px;cursor:pointer;width:100%;margin-top:22px}small{color:#666}</style></head><body><main class="card"><h1>📖 Webtoon2Kindle</h1><p>Convert authorized comic images into Kindle Paperwhite 6.8-inch pages (1236 × 1648).</p><form action="/convert" method="post" enctype="multipart/form-data"><label for="images">Comic images (up to 30, in selected order)</label><input id="images" type="file" name="images" accept="image/png,image/jpeg,image/webp" multiple required><label for="format">Export format</label><select id="format" name="format"><option value="cbz">CBZ (recommended for KOReader)</option><option value="pdf">PDF</option></select><label><input type="checkbox" name="grayscale" checked> Grayscale + contrast</label><button type="submit">Convert and download</button></form><p><small>Local-only by default. Simple horizontal cuts may split panels; smart panel detection is planned for v2.</small></p></main></body></html>
